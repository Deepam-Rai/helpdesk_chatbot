name: Deploy to prod on specific tag push

on:
  push:
    tags:
      - v*.*.* # Triggers when pushing tags like v1.0.0, v2.1.3, vXX.XX.XX etc.

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Print Tag Name
        run: echo "Deploying release for ${{ github.ref }}"
